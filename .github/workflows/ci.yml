name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: pnpm test
      - name: Run the CLI
        shell: bash
        run: |
          node bin/folderdiff.js --version
          node bin/folderdiff.js samples "$RUNNER_TEMP/samples"
          set +e
          node bin/folderdiff.js compare "$RUNNER_TEMP/samples/left" "$RUNNER_TEMP/samples/right"
          code=$?
          set -e
          test "$code" -eq 1
          node bin/folderdiff.js compare "$RUNNER_TEMP/samples/left" "$RUNNER_TEMP/samples/right" --json > "$RUNNER_TEMP/result.json" || test $? -eq 1
          node -e "const t=require(process.argv[1]).totals;if(t.onlyLeft!==1||t.onlyRight!==3||t.typeChanged!==1)process.exit(1)" "$RUNNER_TEMP/result.json"
          # A second sample set is identical to the first, so compare must exit 0.
          node bin/folderdiff.js samples "$RUNNER_TEMP/samples-copy"
          node bin/folderdiff.js compare "$RUNNER_TEMP/samples/left" "$RUNNER_TEMP/samples-copy/left"
